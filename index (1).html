<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Șeptica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6DFD0; --panel:#F3EEE3; --panel2:#ECE5D6; --ink:#2A2420; --muted:#6B6158; --line:#CABDA6;
  --red:#A3261D; --redSoft:rgba(163,38,29,.10);
  --cardFace:#FFFDF8; --cardInk:#26211D; --cardRed:#B0291F; --cardEdge:rgba(0,0,0,.18);
  --focus:#1F5FA8; --ok:#2F6B3A;
  --serif:'Alegreya', Georgia, 'Times New Roman', serif;
  --sans:'Alegreya Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cw:74px; --tw:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1815; --panel:#27211E; --panel2:#221D1A; --ink:#EEE5D8; --muted:#A89C8F; --line:#3F3530;
    --red:#DB5A4E; --redSoft:rgba(219,90,78,.14);
    --cardFace:#F4EEE3; --cardEdge:rgba(0,0,0,.5); --focus:#86B4F2; --ok:#86C993;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1815; --panel:#27211E; --panel2:#221D1A; --ink:#EEE5D8; --muted:#A89C8F; --line:#3F3530;
  --red:#DB5A4E; --redSoft:rgba(219,90,78,.14);
  --cardFace:#F4EEE3; --cardEdge:rgba(0,0,0,.5); --focus:#86B4F2; --ok:#86C993;
}
@media (min-width:720px){ :root{ --cw:88px; --tw:66px; } }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
.stitch{height:18px;background-image:var(--stitch);background-size:18px 18px;background-repeat:repeat-x}

/* hero */
.hero{padding:28px 0 8px}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,11vw,5.6rem);line-height:.95;margin:18px 0 8px;letter-spacing:-.01em}
.hero p{margin:0;max-width:34em;color:var(--muted);font-size:1.12rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;margin-top:16px}
.panel h2{font-family:var(--serif);font-size:1.45rem;margin:0 0 6px;font-weight:700}
.panel p{margin:6px 0}
.muted{color:var(--muted)}
label{display:block;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;max-width:320px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 12px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.code-in{max-width:120px!important;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.tables{list-style:none;padding:0;margin:12px 0 0}
.tables li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tables li:first-child{border-top:0}
.tables .code{font-family:var(--serif);font-weight:800;font-size:1.2rem;letter-spacing:.08em;margin-right:8px}
.rules p{max-width:40em}
.rules summary{cursor:pointer;font-family:var(--serif);font-size:1.3rem;font-weight:700}

/* topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.topbar .title{font-family:var(--serif);font-weight:800;font-size:1.5rem}
.topbar .title span{font-weight:500;color:var(--muted);font-size:1.05rem;margin-left:8px}

/* lobby */
.seats{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.seats li{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;min-height:64px}
.seats li.taken{border-style:solid;background:var(--panel2)}
.seats .n{font-size:.85rem;color:var(--muted)}
.seats .who{font-family:var(--serif);font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.bigcode{font-family:var(--serif);font-weight:800;font-size:2.6rem;letter-spacing:.14em;line-height:1}

/* game */
.players{display:flex;flex-wrap:wrap;gap:10px}
.seat{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px 10px;position:relative;overflow:hidden}
.seat::before{content:"";display:block;height:9px;margin:0 -12px 8px;background-image:var(--stitch);background-size:9px 9px;background-repeat:repeat-x;opacity:0;transition:opacity .25s}
.seat.turn{border-color:var(--red)}
.seat.turn::before{opacity:1}
.seat .who{font-family:var(--serif);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.seat .meta{font-size:.92rem;color:var(--muted)}
.backs{display:flex;margin-top:6px;height:26px}
.backs i{width:18px;height:26px;border-radius:3px;background:var(--cardFace) var(--stitch-sm);background-size:6px 6px;border:1px solid var(--cardEdge);margin-right:-8px}
.tag{display:inline-block;font-size:.8rem;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin-left:6px;color:var(--muted);vertical-align:2px}

.table{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:16px;min-height:calc(var(--tw)*1.42 + 70px)}
.deck{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.9rem;color:var(--muted)}
.trick{display:flex;flex-direction:column;gap:8px;min-width:0}
.trick-cards{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.tc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.82rem;color:var(--muted);max-width:calc(var(--tw) + 10px);text-align:center;overflow-wrap:anywhere}
.tc.lead .card{outline:2px solid var(--line);outline-offset:2px}
.tc.win .card{outline:2px solid var(--red);outline-offset:2px}
.trick-info{font-size:.95rem}
.faded{opacity:.55}
.status{margin:14px 0 8px;font-family:var(--serif);font-size:1.25rem;font-weight:700;min-height:1.6em}

.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.42);border-radius:8px;background:var(--cardFace);color:var(--cardInk);border:1px solid var(--cardEdge);position:relative;font-family:var(--serif);box-shadow:0 1px 0 rgba(0,0,0,.12),0 4px 10px -6px rgba(0,0,0,.5);padding:0;flex:none;overflow:hidden}
.card.t{--w:var(--tw)}
.card.red{color:var(--cardRed)}
.card .c1,.card .c2{position:absolute;line-height:.95;font-weight:700;font-size:calc(var(--w)*.21);text-align:center;width:1.3em}
.card .c1{top:5px;left:4px}
.card .c2{bottom:5px;right:4px;transform:rotate(180deg)}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.46);line-height:1}
.card .mid.face{font-weight:800;font-size:calc(var(--w)*.42)}
.card.wild::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background-image:var(--stitch);background-size:7px 7px;background-repeat:repeat-x}
.card.back{background:var(--cardFace) var(--stitch-sm);background-size:9px 9px}
button.card{cursor:pointer;transition:transform .12s ease}
button.card:not(:disabled):hover{transform:translateY(-6px)}
button.card:disabled{cursor:not-allowed;opacity:.42}
.hand{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px 0 6px;min-height:calc(var(--cw)*1.42 + 24px)}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.score{margin-top:14px;font-size:.95rem;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:20}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:10}
.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;overflow:hidden}
.result .in{padding:18px 20px 22px}
.result h2{font-family:var(--serif);font-size:2rem;margin:0 0 8px}
.result table{width:100%;border-collapse:collapse;margin:8px 0 12px}
.result td{padding:6px 0;border-top:1px solid var(--line)}
.result td:last-child{text-align:right;font-weight:700}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.netmsg{background:var(--redSoft);border:1px solid var(--red);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ---------- cross-stitch motif ---------- */
(function(){
  function svg(red, dark){
    let r='';
    for(let i=0;i<9;i++)for(let j=0;j<9;j++){
      const d=Math.abs(i-4)+Math.abs(j-4);
      const col=d===4||d===0?red:d===2?dark:null;
      if(col) r+=`<rect x="${i*2}" y="${j*2}" width="2" height="2" fill="${col}"/>`;
    }
    return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'>${r}</svg>`)}")`;
  }
  const L=svg('#A3261D','#2A2420'), D=svg('#DB5A4E','#EEE5D8'), C=svg('#B0291F','#26211D');
  const st=document.createElement('style');
  st.textContent=`:root{--stitch:${L};--stitch-sm:${C}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stitch:${D}}}
:root[data-theme="dark"]{--stitch:${D}}`;
  document.head.appendChild(st);
})();

/* ---------- game engine ---------- */
const RANKS=['7','8','9','10','J','Q','K','A'];
const SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const rk=c=>c.slice(0,-1), su=c=>c.slice(-1);
const isPt=c=>rk(c)==='10'||rk(c)==='A';
const cuts=(c,rank)=>rk(c)===rank||rk(c)==='7';
const team=(s,n)=>n===4?s%2:s;
const clone=o=>JSON.parse(JSON.stringify(o));
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(n){const d=[];for(const r of RANKS)for(const s of 'shdc')d.push(r+s);return shuffle(n===3?d.filter(c=>c!=='8d'&&c!=='8c'):d)}

function newGame(n,starter){
  const g={n,deck:makeDeck(n),hands:{},points:{},starter,turn:starter,
    trick:{leader:starter,rank:null,cards:[],winner:null,round:0,phase:'play'},
    lastTrick:null,result:null,over:false};
  for(let s=0;s<n;s++){g.hands[s]=[];g.points[s]=0}
  for(let k=0;k<4;k++)for(let i=0;i<n;i++)g.hands[(starter+i)%n].push(g.deck.pop());
  return g;
}
function play(g0,seat,card){
  if(g0.over) return {err:'Jocul s-a terminat.'};
  if(g0.turn!==seat) return {err:'Nu e rândul tău.'};
  const g=clone(g0), h=g.hands[seat], i=h.indexOf(card), t=g.trick;
  if(i<0) return {err:'Nu ai cartea asta.'};
  if(t.phase==='decide'&&!cuts(card,t.rank)) return {err:`Ca să continui îți trebuie un ${t.rank} sau un 7.`};
  h.splice(i,1);
  t.cards.push({c:card,s:seat});
  if(t.rank===null){t.rank=rk(card);t.winner=seat;t.round=1}
  else if(t.phase==='decide'){t.winner=seat;t.round=1;t.phase='play'}
  else{if(cuts(card,t.rank))t.winner=seat;t.round++}
  if(t.round>=g.n) endRound(g); else g.turn=(seat+1)%g.n;
  return {g};
}
function endRound(g){
  const t=g.trick;
  const same=team(t.winner,g.n)===team(t.leader,g.n);
  const canGo=g.hands[t.leader].some(c=>cuts(c,t.rank));
  if(same||!canGo) collect(g); else {t.phase='decide';g.turn=t.leader}
}
function stopTrick(g0,seat){
  if(g0.trick.phase!=='decide'||g0.turn!==seat) return {err:'Nu poți lăsa mâna acum.'};
  const g=clone(g0); collect(g); return {g};
}
function collect(g){
  const t=g.trick, w=t.winner, pts=t.cards.filter(x=>isPt(x.c)).length;
  g.points[w]+=pts;
  g.lastTrick={cards:t.cards,winner:w,pts};
  while(g.deck.length){
    let drew=false;
    for(let i=0;i<g.n&&g.deck.length;i++){const s=(w+i)%g.n;if(g.hands[s].length<4){g.hands[s].push(g.deck.pop());drew=true}}
    if(!drew)break;
  }
  g.trick={leader:w,rank:null,cards:[],winner:null,round:0,phase:'play'};
  g.turn=w;
  if(Object.values(g.hands).every(h=>h.length===0)) finish(g);
}
function finish(g){
  g.over=true; g.turn=-1;
  if(g.n===4){
    const a=g.points[0]+g.points[2], b=g.points[1]+g.points[3];
    g.result={teams:[a,b],win:a>b?[0]:b>a?[1]:[]};
  }else{
    const arr=[...Array(g.n).keys()].map(s=>g.points[s]), mx=Math.max(...arr);
    const top=arr.map((p,s)=>p===mx?s:-1).filter(s=>s>=0);
    g.result={win:top.length===g.n?[]:top};
  }
}

/* ---------- computer player ---------- */
function botMove(g,s){
  const h=g.hands[s], t=g.trick, n=g.n;
  const val=c=>(isPt(c)?10:0)+(rk(c)==='7'?25:0)+RANKS.indexOf(rk(c))*.1;
  const low=a=>a.length?a.slice().sort((x,y)=>val(x)-val(y))[0]:null;
  if(t.rank===null){
    const cnt=r=>h.filter(c=>rk(c)===r).length;
    return {card:h.slice().sort((a,b)=>(val(a)-cnt(rk(a))*3)-(val(b)-cnt(rk(b))*3))[0]};
  }
  const tp=t.cards.filter(x=>isPt(x.c)).length;
  const nat=h.filter(c=>rk(c)===t.rank&&t.rank!=='7'), sev=h.filter(c=>rk(c)==='7');
  if(t.phase==='decide'){
    if(tp>0&&nat.length) return {card:nat[0]};
    if(tp>=2&&sev.length) return {card:sev[0]};
    return {stop:true};
  }
  if(team(t.winner,n)===team(s,n)){
    const p=h.filter(c=>isPt(c)); return {card:p.length?p[0]:low(h.filter(c=>rk(c)!=='7'))||low(h)};
  }
  const last=t.round===n-1;
  if(nat.length&&(tp>0||isPt(nat[0])||last)) return {card:nat[0]};
  if(sev.length&&tp>=1&&(last||tp>=2)) return {card:sev[0]};
  return {card:low(h.filter(c=>!cuts(c,t.rank)&&!isPt(c)))||low(h.filter(c=>rk(c)!=='7'))||low(h)};
}

/* ---------- app state ---------- */
const PREFIX='septica-ro-v1-';
const BOTS=['Ion','Maria','Gheorghe'];
const S={view:'home',mode:null,pid:null,name:'',joinCode:'',invite:null,code:null,doc:null,local:null,
  busy:false,armAbandon:false,armClose:false,peer:null,conns:new Map(),conn:null,netMsgText:''};
const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4000)}
function myName(){return (S.name||'').trim().slice(0,20)||'Jucător'}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function curDoc(){return S.mode==='local'?S.local:S.doc}
function myId(){return S.mode==='local'?'me':S.pid}
function randCode(){const A='ABCDEFGHJKLMNPRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=A[rnd(A.length)];return s}
function shareLink(code){return location.origin+location.pathname+'?masa='+code}

/* ---------- rendering ---------- */
function cardHTML(c,opts={}){
  const r=rk(c), s=SYM[su(c)], red=su(c)==='h'||su(c)==='d', face=['J','Q','K'].includes(r);
  const cls=`card${opts.t?' t':''}${red?' red':''}${r==='7'?' wild':''}`;
  const lbl=`${r} de ${({s:'pică',h:'inimă roșie',d:'romb',c:'treflă'})[su(c)]}`;
  const inner=`<span class="c1">${r}<br>${s}</span><span class="mid${face?' face':''}">${face?r:s}</span><span class="c2">${r}<br>${s}</span>`;
  if(opts.btn) return `<button class="${cls}" data-act="play" data-card="${c}" aria-label="${lbl}"${opts.disabled?' disabled':''}>${inner}</button>`;
  return `<div class="${cls}" role="img" aria-label="${lbl}">${inner}</div>`;
}
function render(){
  const ae=document.activeElement, fid=ae&&ae.id;
  let sel=null; try{if(fid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  $app.innerHTML=S.view==='home'?homeHTML():tableHTML();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function netMsg(){return S.netMsgText?`<div class="netmsg" role="status">${esc(S.netMsgText)}</div>`:''}
function backBtn(){
  if(S.mode==='host') return `<button class="btn ghost small" data-act="home">${S.armClose?'Sigur? Masa se închide':'Închide masa'}</button>`;
  return `<button class="btn ghost small" data-act="home">Înapoi</button>`;
}
function homeHTML(){
  const saved=store.get('septica-host'), last=store.get('septica-last');
  const savedOk=saved&&saved.code&&Date.now()-(saved.ts||0)<12*3600e3;
  const lastOk=last&&last.code&&Date.now()-(last.ts||0)<12*3600e3&&!(savedOk&&saved.code===last.code);
  const peerOk=!!window.Peer;
  let friends='';
  if(!peerOk) friends=`<p class="muted">Nu s-a putut încărca partea de joc online. Verifică internetul și reîncarcă pagina. Între timp, poți exersa cu calculatorul.</p>`;
  else friends=`<p class="muted">Creezi o masă și le trimiți prietenilor linkul. Masa stă deschisă cât timp pagina ta e deschisă, așa că nu o închide în timpul jocului.</p>
  <div class="row"><button class="btn" data-act="create">Creează o masă nouă</button></div>
  <div class="row"><label for="code" style="margin:0">Intră cu un cod</label>
  <input type="text" id="code" class="code-in" maxlength="4" placeholder="ABCD" value="${esc(S.joinCode)}" autocomplete="off">
  <button class="btn ghost" data-act="join">Intră</button></div>
  ${savedOk?`<div class="row"><button class="btn ghost" data-act="reopen">Redeschide masa ta ${esc(saved.code)}</button></div>`:''}
  ${lastOk?`<div class="row"><button class="btn ghost" data-act="join" data-code="${esc(last.code)}">Revino la masa ${esc(last.code)}</button></div>`:''}`;
  return `<header class="hero"><div class="stitch"></div><h1>Șeptica</h1>
  <p>Jocul în care șeptarul taie tot. Pentru 2, 3 sau 4 jucători, cu prietenii sau cu calculatorul.</p></header>
  <section class="panel"><label for="name">Numele tău la masă</label>
  <input type="text" id="name" maxlength="20" autocomplete="nickname" placeholder="ex. Andrei" value="${esc(S.name)}">
  ${S.invite&&peerOk?`<p style="margin-top:14px">Ai fost invitat la masa <strong>${esc(S.invite)}</strong>.</p><div class="row"><button class="btn red" data-act="join" data-code="${esc(S.invite)}">Intră la masă</button></div>`:''}</section>
  <section class="panel"><h2>Joacă cu prietenii</h2>${friends}</section>
  <section class="panel"><h2>Exersează cu calculatorul</h2>
  <p class="muted">Joci pe loc, fără să aștepți pe nimeni. La 4 jucători, partenerul tău stă vizavi.</p>

}

function gameHTML(d){
  const g=d.game, pl=d.players, n=g.n, me=pl.findIndex(p=>p.id===myId()), t=g.trick;
  const nm=s=>s===me?'tu':(pl[s]?.name||'Cineva');
  const order=[]; const base=me>=0?me:0; for(let i=0;i<n;i++)order.push((base+i)%n);
  const others=me>=0?order.slice(1):order;
  const seatBox=s=>`<div class="seat${g.turn===s?' turn':''}"><div class="who">${esc(pl[s]?.name)}${s===me?' (tu)':''}${S.mode!=='local'&&d.online&&!d.online.includes(pl[s]?.id)?'<span class="tag">deconectat</span>':''}${n===4?`<span class="tag">echipa ${s%2+1}</span>`:''}</div>
    <div class="meta">${g.points[s]} ${g.points[s]===1?'punct':'puncte'}</div>
    ${s===me?'':`<div class="backs" aria-label="${g.hands[s].length} cărți în mână">${'<i></i>'.repeat(g.hands[s].length)}</div>`}</div>`;
  // table centre
  let centre='';
  if(t.cards.length){
    centre=`<div class="trick-cards">${t.cards.map((x,i)=>`<div class="tc${i===t.cards.length-1-[...t.cards].reverse().findIndex(y=>y.s===t.winner)?' win':''}">${cardHTML(x.c,{t:1})}<span>${esc(nm(x.s))}</span></div>`).join('')}</div>
    <div class="trick-info">${t.rank==='7'?'Se taie doar cu 7.':`Se taie cu ${t.rank} sau cu 7.`} ${t.winner===me?'Deocamdată iei tu.':`Deocamdată ia ${esc(nm(t.winner))}.`}</div>`;
  }else if(g.lastTrick){
    const L=g.lastTrick;
    centre=`<div class="trick-info">${L.winner===me?'Mâna trecută ai luat-o tu':`Mâna trecută a luat-o ${esc(nm(L.winner))}`}${L.pts?` (+${L.pts} ${L.pts===1?'punct':'puncte'})`:', fără puncte'}.</div>
    <div class="trick-cards faded">${L.cards.map(x=>`<div class="tc">${cardHTML(x.c,{t:1})}<span>${esc(nm(x.s))}</span></div>`).join('')}</div>`;
  }else centre=`<div class="trick-info muted">Masa e goală. ${g.turn===me?'Tu începi.':`Începe ${esc(nm(g.turn))}.`}</div>`;
  // status
  let status='';
  if(g.over) status='Jocul s-a terminat.';
  else if(g.turn===me){
    if(t.rank===null) status='Tu începi mâna. Pune orice carte.';
    else if(t.phase==='decide') status=`Ți s-a tăiat. Continui cu ${t.rank==='7'?'un 7':`un ${t.rank} sau un 7`}, ori lași mâna.`;
    else status=t.rank==='7'?'E rândul tău. Acum taie doar un 7.':`E rândul tău. Taie cu un ${t.rank} sau un 7, ori pune altă carte.`;
  }else if(t.phase==='decide') status=`${esc(nm(g.turn))} alege dacă mai continuă.`;
  else status=`Acum joacă ${esc(nm(g.turn))}.`;
  // hand
  let hand='';
  if(me>=0){
    const my=g.hands[me], myTurn=g.turn===me&&!S.busy&&!g.over;
    const sorted=my.slice().sort((a,b)=>RANKS.indexOf(rk(a))-RANKS.indexOf(rk(b))||su(a).localeCompare(su(b)));
    hand=`<div class="hand">${sorted.map(c=>cardHTML(c,{btn:1,disabled:!myTurn||(t.phase==='decide'&&!cuts(c,t.rank))})).join('')||'<span class="muted">Nu mai ai cărți.</span>'}</div>
    <div class="controls">${t.phase==='decide'&&g.turn===me&&!g.over?`<button class="btn red" data-act="stop"${S.busy?' disabled':''}>Las mâna</button>`:''}</div>`;
  }else hand=`<p class="muted" style="text-align:center">Urmărești jocul de pe margine.</p>`;
  // score
  const tally=d.tally||{};
  let score='';
  if(n===4){
    const a=g.points[0]+g.points[2], b=g.points[1]+g.points[3];
    score=`Puncte în jocul ăsta: echipa 1 (${esc(pl[0].name)} și ${esc(pl[2].name)}) are ${a}, echipa 2 (${esc(pl[1].name)} și ${esc(pl[3].name)}) are ${b}. Jocuri câștigate: ${tally.t0||0} la ${tally.t1||0}.`;
  }else score=`Jocuri câștigate la masa asta: ${pl.map((p,s)=>`${esc(p.name)} ${tally['p'+s]||0}`).join(', ')}.`;
  const abandonLbl=S.mode==='local'?'Ieși din joc':(S.armAbandon?'Sigur? Apasă din nou':'Oprește jocul');
  return `<div class="topbar">${backBtn()}
  <span class="title">Șeptica<span>${S.mode==='local'?'cu calculatorul':'masa '+esc(d.code)}</span></span>
  ${me>=0?`<button class="btn ghost small" data-act="abandon">${abandonLbl}</button>`:''}</div>
  ${netMsg()}
  <div class="players">${others.map(seatBox).join('')}</div>
  <div class="table"><div class="deck">${g.deck.length?`<div class="card t back" aria-hidden="true"></div><span>${g.deck.length} în pachet</span>`:'<span>Pachetul s-a terminat</span>'}</div>
  <div class="trick">${centre}</div></div>
  <div class="status" aria-live="polite">${status}</div>
  ${me>=0?`<div class="players">${seatBox(me)}</div>`:''}
  ${hand}
  <p class="score">${score}</p>
  ${g.over?resultHTML(d,me):''}`;
}
function resultHTML(d,me){
  const g=d.game, pl=d.players, n=g.n, win=g.result.win;
  let title, rows='';
  if(n===4){
    const mine=me>=0?me%2:-1;
    title=!win.length?'Egalitate, 4 la 4':win[0]===mine?'Ați câștigat!':mine>=0?'Au câștigat ceilalți':`A câștigat echipa ${win[0]+1}`;
    rows=[0,1].map(k=>`<tr><td>${esc(pl[k].name)} și ${esc(pl[k+2].name)}</td><td>${g.result.teams[k]}</td></tr>`).join('');
  }else{
    title=!win.length?'Egalitate':win.includes(me)?(win.length>1?'Ai câștigat, la egalitate':'Ai câștigat!'):`${win.length>1?'Au câștigat':'A câștigat'} ${win.map(s=>esc(pl[s].name)).join(' și ')}`;
    rows=pl.map((p,s)=>`<tr><td>${esc(p.name)}${s===me?' (tu)':''}</td><td>${g.points[s]}</td></tr>`).join('');
  }
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Rezultat"><div class="result"><div class="stitch"></div><div class="in">
  <h2>${title}</h2><table>${rows}</table>
  <div class="row">${me>=0?`<button class="btn red" data-act="again"${S.busy?' disabled':''}>Încă un joc</button>`:''}${S.mode==='host'?'':'<button class="btn ghost" data-act="home">Înapoi la start</button>'}</div></div></div></div>`;
}

/* ---------- rules for every action (used by host and local mode) ---------- */
function applyGame(d,g){
  const nd=clone(d); nd.game=g; nd.rev=(d.rev||0)+1; nd.updatedAt=Date.now();
  if(g.over&&!(d.game&&d.game.over)){
    nd.status='finished'; nd.tally=nd.tally||{};
    for(const w of g.result.win){const k=(g.n===4?'t':'p')+w; nd.tally[k]=(nd.tally[k]||0)+1}
  }
  return nd;
}
function applyAction(d0,pid,a){
  const d=clone(d0), seat=d.players.findIndex(p=>p.id===pid);
  const bump=()=>{d.rev=(d.rev||0)+1;d.updatedAt=Date.now();return {d}};
  switch(a.a){
    case 'join':
      if(seat>=0){if(a.name)d.players[seat].name=a.name;return bump()}
      if(d.status!=='lobby') return {err:'Jocul a început deja, urmărești de pe margine.'};
      if(d.players.length>=4) return {err:'Masa e plină, urmărești de pe margine.'};
      d.players.push({id:pid,name:a.name||'Jucător'}); d.tally={}; return bump();
    case 'leave':
      if(seat<0||d.status!=='lobby'||pid===d.host) return {err:'Nu poți părăsi masa acum.'};
      d.players.splice(seat,1); d.tally={}; return bump();
    case 'start':
      if(pid!==d.host) return {err:'Doar gazda împarte cărțile.'};
      if(d.status!=='lobby'||d.players.length<2) return {err:'Ai nevoie de cel puțin 2 jucători.'};
      d.status='playing'; d.game=newGame(d.players.length,rnd(d.players.length)); return bump();
    case 'play': case 'stop':{
      if(seat<0||!d.game) return {err:'Nu joci la masa asta.'};
      const r=a.a==='play'?play(d.game,seat,a.card):stopTrick(d.game,seat);
      if(r.err) return r;
      return {d:applyGame(d0,r.g)};}
    case 'again':
      if(seat<0||!d.game||!d.game.over) return {err:'Jocul nu s-a terminat încă.'};
      d.status='playing'; d.game=newGame(d.game.n,(d.game.starter+1)%d.game.n); return bump();
    case 'abandon':
      if(seat<0) return {err:'Nu joci la masa asta.'};
      d.status='lobby'; d.game=null; return bump();
  }
  return {err:'Acțiune necunoscută.'};
}
function doAction(a){
  if(S.mode==='local'){const r=applyAction(S.local,'me',a);if(r.err)return toast(r.err);S.local=r.d;render();scheduleBot();return}
  if(S.mode==='host'){hostApply(S.pid,a,null);return}
  if(S.mode==='client'){
    if(!S.conn||!S.conn.open) return toast('Nu ești conectat la gazdă. Mai așteaptă câteva secunde.');
    S.busy=true;render();S.conn.send({t:'act',a:a.a,card:a.card||null});
    setTimeout(()=>{if(S.busy){S.busy=false;render()}},5000);
  }
}

/* ---------- computer players ---------- */
let botT=null;
function scheduleBot(){
  clearTimeout(botT);
  const d=S.local; if(S.mode!=='local'||!d||!d.game||d.game.over)return;
  const s=d.game.turn, pid=d.players[s].id; if(pid==='me')return;
  botT=setTimeout(()=>{
    if(S.local!==d)return;
    const mv=botMove(d.game,s);
    const r=applyAction(d,pid,mv.stop?{a:'stop'}:{a:'play',card:mv.card});
    if(r.d){S.local=r.d;render();scheduleBot()}
  },d.game.trick.cards.length===0?1100:800);
}
function startLocal(n){
  cleanupNet();clearTimeout(botT);
  const players=[{id:'me',name:myName()}];
  for(let i=1;i<n;i++)players.push({id:'bot'+i,name:BOTS[i-1]});
  S.mode='local';S.view='table';S.armAbandon=false;
  S.local={code:'LOCAL',host:'me',players,status:'playing',game:newGame(n,rnd(n)),tally:{},rev:0};
  render();scheduleBot();
}

/* ---------- peer-to-peer: the host's browser keeps the table ---------- */
function cleanupNet(){
  if(S.conn){try{S.conn.close()}catch(e){}}
  for(const c of S.conns.values()){try{c.close()}catch(e){}}
  if(S.peer){try{S.peer.destroy()}catch(e){}}
  S.peer=null;S.conn=null;S.conns=new Map();S.netMsgText='';S.busy=false;
}
function hostSync(){
  if(S.mode!=='host'||!S.doc)return;
  const on=[S.pid];
  for(const [pid,c] of S.conns) if(c.open) on.push(pid);
  S.doc={...S.doc,online:on};
  for(const c of S.conns.values()) if(c.open){try{c.send({t:'state',doc:S.doc})}catch(e){}}
  store.set('septica-host',{code:S.code,doc:S.doc,ts:Date.now()});
  render();
}
function hostApply(pid,a,conn){
  const r=applyAction(S.doc,pid,a);
  if(r.err){if(conn){try{conn.send({t:'err',msg:r.err})}catch(e){}}else toast(r.err);if(conn)hostSync();return}
  S.doc=r.d; hostSync();
}
function onHostData(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){
    const pid=String(m.id||'').slice(0,40); if(!pid||pid===S.pid)return;
    conn._pid=pid;
    const old=S.conns.get(pid); if(old&&old!==conn){try{old.close()}catch(e){}}
    S.conns.set(pid,conn);
    const name=String(m.name||'').trim().slice(0,20)||'Jucător';
    const r=applyAction(S.doc,pid,{a:'join',name});
    if(r.err){try{conn.send({t:'err',msg:r.err})}catch(e){}} else S.doc=r.d;
    hostSync();return;
  }
  if(m.t==='act'&&conn._pid&&m.a!=='join'){
    hostApply(conn._pid,{a:String(m.a),card:typeof m.card==='string'?m.card:undefined},conn);
  }
}
function startHost(code,doc,fresh){
  cleanupNet();clearTimeout(botT);
  S.mode='host';S.view='table';S.code=code;S.doc=doc;S.armClose=false;S.armAbandon=false;
  S.netMsgText='Se deschide masa…';render();
  let tries=0;
  const open=()=>{
    if(S.mode!=='host'||S.code!==code)return;
    const peer=new Peer(PREFIX+code,{debug:0}); S.peer=peer;
    peer.on('open',()=>{if(S.peer!==peer)return;S.netMsgText='';hostSync()});
    peer.on('connection',conn=>{
      conn.on('data',m=>{if(S.peer===peer)onHostData(conn,m)});
      conn.on('close',()=>{if(conn._pid&&S.conns.get(conn._pid)===conn){S.conns.delete(conn._pid);hostSync()}});
      conn.on('error',()=>{});
    });
    peer.on('error',e=>{
      if(S.peer!==peer)return;
      if(e.type==='unavailable-id'){
        peer.destroy();
        if(fresh){const c=randCode();S.code=code=c;S.doc={...S.doc,code:c};open();return}
        if(++tries<=20){S.netMsgText='Serverul încă ține minte masa veche. Reîncerc în câteva secunde…';render();setTimeout(open,3000)}
        else{toast('Nu am putut redeschide masa. Creează una nouă.');goHome()}
      }else if(e.type==='browser-incompatible'){toast('Browserul ăsta nu suportă jocul online. Încearcă Chrome, Firefox sau Safari.');goHome()}
      else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){S.netMsgText='Probleme de conexiune cu serverul. Reîncerc…';render()}
    });
    peer.on('disconnected',()=>{if(S.peer===peer&&!peer.destroyed)setTimeout(()=>{try{peer.reconnect()}catch(_){}},2000)});
  };
  open();
}
function startClient(code){
  cleanupNet();clearTimeout(botT);
  S.mode='client';S.view='table';S.code=code;S.doc=null;S.armAbandon=false;
  S.netMsgText=`Te conectezi la masa ${code}…`;render();
  store.set('septica-last',{code,ts:Date.now()});
  const peer=new Peer({debug:0}); S.peer=peer;
  let tries=0, everOpen=false, failNow=()=>{};
  const retry=()=>{
    if(S.peer!==peer||S.mode!=='client')return;
    tries++;
    if(!everOpen&&tries>=4){toast(`Nu găsesc masa ${code}. Verifică codul și roagă gazda să țină pagina deschisă.`);goHome();return}
    if(tries>40){toast('Gazda nu mai răspunde.');goHome();return}
    S.netMsgText=everOpen?'Legătura cu gazda s-a pierdut. Reîncerc…':`Caut masa ${code}…`;render();
    setTimeout(connect,3000);
  };
  const connect=()=>{
    if(S.peer!==peer||S.mode!=='client')return;
    const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'}); S.conn=conn;
    let done=false, opened=false;
    failNow=()=>{if(done)return;done=true;retry()};
    const timer=setTimeout(()=>{if(!opened){try{conn.close()}catch(e){}failNow()}},9000);
    conn.on('open',()=>{opened=true;everOpen=true;tries=0;clearTimeout(timer);S.netMsgText='';conn.send({t:'hello',id:S.pid,name:myName()});render()});
    conn.on('data',m=>{
      if(S.conn!==conn||!m)return;
      if(m.t==='state'){S.doc=m.doc;S.busy=false;render()}
      else if(m.t==='err'){S.busy=false;toast(m.msg);render()}
    });
    conn.on('close',()=>{clearTimeout(timer);if(S.conn===conn)failNow()});
    conn.on('error',()=>{});
  };
  peer.on('open',connect);
  peer.on('error',e=>{
    if(S.peer!==peer)return;
    if(e.type==='peer-unavailable') failNow();
    else if(e.type==='browser-incompatible'){toast('Browserul ăsta nu suportă jocul online. Încearcă Chrome, Firefox sau Safari.');goHome()}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){S.netMsgText='Probleme de conexiune cu serverul. Reîncerc…';render()}
  });
  peer.on('disconnected',()=>{if(S.peer===peer&&!peer.destroyed)setTimeout(()=>{try{peer.reconnect()}catch(_){}},2000)});
}
function goHome(){
  cleanupNet();clearTimeout(botT);
  S.view='home';S.mode=null;S.code=null;S.doc=null;S.local=null;S.armAbandon=false;S.armClose=false;render();
}

/* ---------- actions ---------- */
function act(a,ds){
  switch(a){
    case 'home':
      if(S.mode==='host'){
        if(!S.armClose){S.armClose=true;render();setTimeout(()=>{S.armClose=false;if(S.mode==='host')render()},4000);return}
        store.del('septica-host');
      }else if(S.mode==='client'&&S.doc&&S.doc.status==='lobby'&&S.conn&&S.conn.open){
        try{S.conn.send({t:'act',a:'leave'})}catch(e){}
        store.del('septica-last');
      }
      setTimeout(goHome,S.mode==='client'?150:0); break;
    case 'local': startLocal(+ds.n); break;
    case 'create':{
      if(!window.Peer)return toast('Jocul online nu s-a încărcat. Reîncarcă pagina.');
      const code=randCode();
      startHost(code,{code,host:S.pid,players:[{id:S.pid,name:myName()}],status:'lobby',game:null,tally:{},rev:0,updatedAt:Date.now()},true);
      break;}
    case 'reopen':{
      const s=store.get('septica-host'); if(!s)return;
      const doc=clone(s.doc); S.pid=doc.host; try{sessionStorage.setItem('septica-id',S.pid)}catch(e){}
      const me=doc.players.find(p=>p.id===S.pid); if(me)me.name=myName();
      startHost(s.code,doc,false); break;}
    case 'join':{
      if(!window.Peer)return toast('Jocul online nu s-a încărcat. Reîncarcă pagina.');
      const code=String(ds.code||S.joinCode||'').toUpperCase().replace(/[^A-Z]/g,'');
      if(code.length!==4)return toast('Codul mesei are 4 litere.');
      const saved=store.get('septica-host');
      if(saved&&saved.code===code&&saved.doc&&saved.doc.host===S.pid){act('reopen',{});return}
      S.invite=null; startClient(code); break;}
    case 'copy':{
      const link=shareLink(S.code);
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(()=>toast('Link copiat.'),()=>toast('Nu am putut copia. Selectează linkul și copiază-l manual.'));
      else toast('Selectează linkul și copiază-l manual.');
      break;}
    case 'leave': act('home',{}); break;
    case 'start': doAction({a:'start'}); break;
    case 'play': doAction({a:'play',card:ds.card}); break;
    case 'stop': doAction({a:'stop'}); break;
    case 'again': doAction({a:'again'}); break;
    case 'abandon':
      if(S.mode==='local'){goHome();return}
      if(!S.armAbandon){S.armAbandon=true;render();setTimeout(()=>{S.armAbandon=false;render()},4000);return}
      S.armAbandon=false; doAction({a:'abandon'}); break;
  }
}
$app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset)});
$app.addEventListener('input',e=>{
  if(e.target.id==='name'){S.name=e.target.value;store.set('septica-name',S.name)}
  if(e.target.id==='code'){S.joinCode=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);e.target.value=S.joinCode}
});
$app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')act('join',{})});
window.addEventListener('beforeunload',e=>{if(S.mode==='host'&&S.doc&&S.doc.players.length>1){e.preventDefault();e.returnValue=''}});

/* ---------- boot ---------- */
(function(){
  S.name=store.get('septica-name')||'';
  // one id per browser tab (survives a refresh), so two tabs on one computer count as two players
  let pid=null; try{pid=sessionStorage.getItem('septica-id')}catch(e){}
  if(!pid){pid='p'+Array.from(crypto.getRandomValues(new Uint8Array(9)),b=>b.toString(16).padStart(2,'0')).join('');try{sessionStorage.setItem('septica-id',pid)}catch(e){}}
  S.pid=pid;
  const q=new URLSearchParams(location.search).get('masa');
  if(q&&/^[A-Za-z]{4}$/.test(q)){S.invite=q.toUpperCase();S.joinCode=S.invite}
  render();
  if(S.invite&&!S.name){const el=document.getElementById('name');if(el)el.focus()}
})();
</script>
